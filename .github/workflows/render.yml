name: Render Video

on:
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write

concurrency:
  group: render-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Render scenes
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: node renderer/render.js

      - name: Publish MP4 as release asset
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          TAG="render-${JOB_ID}"
          gh release create "$TAG" final.mp4 --title "Render ${JOB_ID}" --notes "Auto-rendered documentary MP4 for job ${JOB_ID}."
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4" >> "$GITHUB_OUTPUT"

      - name: Notify app (success)
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          MP4_URL: ${{ steps.rel.outputs.url }}
        run: node renderer/callback.js done "$MP4_URL" "Render complete"

      - name: Notify app (failure)
        if: failure()
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: node renderer/callback.js failed "" "Render failed in GitHub Actions"
